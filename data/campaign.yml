npcs:
  - id: bonnie-morgas
    name: Bonnie Morgas
    role: Dealer of Favors & Secrets
    location: bonnie-morgas-cottage
    description: >-
      Appearing to be a human woman in her mid-forties, Bonnie resides in her
      cottage and dispenses favors in exchange for rare resources and
      intelligence. In a pro bono gesture, she provided the party with blood to
      drink, restoring their forgotten memories of their mortal deaths and their
      task from the Man in the Green Cloak. She has now tasked the party with
      bringing Ezekiel Frond to her cottage, claiming she wishes to take him as
      a student.
  - id: sir-alabaster-cain
    name: Sir Alabaster Cain
    role: Knight of the House of Salt
    location: house-of-salt
    description: >-
      A stalwart knight aligned with the House of Salt. After the party fought
      alongside him to defeat a four-handed monstrosity, he promised them a
      rewarding favor should they seek him out at the House of Salt.
  - id: nicodemus
    name: Nicodemus
    role: Debtor & Shore dweller
    location: hollowtown
    description: >-
      An acquaintance on the lower shores who owed a favor to Bonnie Morgas and
      entrusted a mysterious stone to Maleficent to deliver to Bonnie to clear
      his debt.
  - id: ezekiel-frond
    name: Ezekiel Frond
    role: Wandering Wizard
    location: leviathan-husk
    description: >-
      A traveler and wizard who has made his dwelling inside the calcified
      leviathan carcass on the western coast for the past few months. The party
      has not yet met him.
  - id: archon-iao
    name: Archon Iao
    role: Devil Archon of the House of Salt
    location: house-of-salt
    description: >-
      One of the five devil Archons governing territories across the Shrike, and
      the only Archon whose seat resides at the lowest level bordering the
      ocean.
  - id: man-in-the-green-cloak
    name: The Man in the Green Cloak
    role: Harbinger of Redemption
    location: shrike
    description: >-
      A mysterious cloaked entity who visited each party member at the moment of
      their mortal death across different centuries, offering salvation from
      Hell in exchange for journeying to Shrike to liberate the pierced Nameless
      God.
