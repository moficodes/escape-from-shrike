settings:
  gameSystem: daggerheart
  themePreset: gothic-horror
home:
  header:
    title: Escape from Shrike
    description: >-
      Five condemned souls granted a second chance upon the Spire of Shrike.
      Bound by blood and restored memory, their immediate task is to bring
      Ezekiel Frond to Bonnie Morgas.
    navBrand: Escape from Shrike
  nextSession: Oct 19, 2026
  activeQuest:
    title: Bring Ezekiel Frond to Bonnie Morgas
    status: active
    locationId: leviathan-husk
    description: >-
      Bonnie Morgas asked the party for a favor: bring Ezekiel Frond from the
      leviathan husk to her cottage, claiming she wishes to take him on as a
      student.
  questList:
    - title: Bring Ezekiel Frond to Bonnie Morgas
      status: active
      locationId: leviathan-husk
      description: >-
        Bonnie Morgas asked the party for a favor: bring Ezekiel Frond from the
        leviathan husk to her cottage, claiming she wishes to take him on as a
        student.
    - title: Deliver Nicodemus's Stone to Bonnie Morgas
      status: completed
      locationId: bonnie-morgas-cottage
      description: >-
        Delivered the peculiar stone from Nicodemus to Bonnie Morgas at her
        cottage to settle an old favor.
    - title: Seek the Favor of Sir Alabaster Cain
      status: pending
      locationId: house-of-salt
      description: >-
        Visit Sir Alabaster Cain at the House of Salt to collect the reward and
        favor promised for helping him defeat the four-handed monstrosity.
    - title: Free the Pierced Nameless God
      status: pending
      locationId: shrike
      description: >-
        The overarching pact made with the Man in the Green Cloak: ascend the
        spire of Shrike and unbind the immortal, bleeding Nameless God whose
        divine blood sustains the realm.
  lastLocationId: bonnie-morgas-cottage
  nextDestinationId: leviathan-husk
locations:
  - id: shrike
    name: The Shrike
    region: Central Spire
    description: >-
      A colossal jagged spire severed from the rest of Hell approximately 515
      years ago. High atop the spire, an immortal Nameless God remains pierced
      through; sustained by divine energy he cannot die, and his cascading blood
      nourishes the dark vitality and arcane power of the entire realm.
  - id: hollowtown
    name: Hollowtown
    region: Lower Shores
    description: >-
      A fragile shoreline settlement of roughly 100 inhabitants clinging to
      existence at the base of the Shrike near the sea, where scavengers and
      newcomers eke out a living.
  - id: both-of-the-iron-coffins
    name: Both of the Iron Coffins
    region: Lower Shores
    description: >-
      A grim expanse of shore where iron coffins wash up from the black waters
      or protrude from the ground. Many newcomers to the Shrike who arrived
      through mortal death first awaken inside these iron sarcophagi.
  - id: longpoint
    name: Longpoint
    region: Lateral Spine
    description: >-
      A small settlement clustered around a lateral spine of the Shrike—a sharp
      rock protrusion extending outward from the spire. Rumor says that anyone
      who walks the entire length of the spine will find an exit from the
      Shrike, though no one has ever returned to confirm it.
  - id: leviathan-husk
    name: Calcified Leviathan Husk
    region: Western Coast
    description: >-
      The massive petrified carcass of a leviathan resting along the western
      coast of the island. Over the last few months, a wandering wizard named
      Ezekiel Frond has taken up residence within the shelter of its hollowed
      ribs.
  - id: house-of-salt
    name: House of Salt
    region: Ocean Level
    description: >-
      The domain and seat of Archon Iao. Uniquely situated among the five devil
      Archons as the only house located at the lowest level near the ocean
      shores. Sir Alabaster Cain serves as an honorable knight under this house.
  - id: bonnie-morgas-cottage
    name: Bonnie Morga's Cottage
    region: Lower Shrike
    description: >-
      The secluded dwelling of Bonnie Morgas, where travelers trade secrets and
      resources for her favors. It is here the party drank blood and awakened to
      their true memories.
timeline:
  title: Campaign Timeline
  subtitle: The story so far
  description: Events of our heroes
  events:
    - id: evt-shrike-severed
      title: The Severance of Shrike and the Pierced God
      type: general
      locationId: shrike
      description: >-
        Approximately 515 years ago, Shrike was severed from the rest of Hell.
        At the peak of the spire, an immortal Nameless God was pierced through;
        sustained by divine energy he cannot die, and his flowing blood
        nourishes the dark life and arcane power of the spire.
      time:
        era: Shrike Era
        year: 0
        month: Month 1
        day: 1
    - id: evt-arrival-loki
      title: Arrival of Loki Morgulis
      type: general
      locationId: both-of-the-iron-coffins
      description: >-
        Fifteen years after Shrike's creation (~500 years ago), Loki Morgulis,
        an elven wizard facing damnation for mortal atrocities, accepts an offer
        of redemption from the Man in the Green Cloak to enter Shrike and free
        the Nameless God.
      time:
        era: Shrike Era
        year: 15
        month: Month 7
        day: 19
    - id: evt-arrival-fire-patch
      title: Arrival of Fire Patch
      type: general
      locationId: both-of-the-iron-coffins
      description: >-
        Four hundred and eighty years after Loki (20 years ago), Fire Patch, a
        Firebug ranger, receives the redemption offer from the Man in the Green
        Cloak at the moment of his death and awakens in Shrike.
      time:
        era: Shrike Era
        year: 495
        month: Month 3
        day: 24
    - id: evt-arrival-maleficent
      title: Arrival of Maleficent
      type: general
      locationId: both-of-the-iron-coffins
      description: >-
        Fifteen years after Fire Patch (5 years ago), Maleficent, a faun rogue,
        accepts the Man in the Green Cloak's offer upon death and is sent to
        Shrike.
      time:
        era: Shrike Era
        year: 510
        month: Month 10
        day: 8
    - id: evt-arrival-moriarty
      title: Arrival of Moriarty
      type: general
      locationId: both-of-the-iron-coffins
      description: >-
        Three years ago, Moriarty, a tiefling sorcerer, receives the offer of
        salvation from the Man in the Green Cloak and is sent to Shrike.
      time:
        era: Shrike Era
        year: 512
        month: Month 6
        day: 15
    - id: evt-arrival-flora
      title: Arrival of Flora
      type: general
      locationId: both-of-the-iron-coffins
      description: >-
        Two years ago, Flora, an Aetheris assassin, is granted a chance at
        redemption by the Man in the Green Cloak and sent to Shrike.
      time:
        era: Shrike Era
        year: 513
        month: Month 12
        day: 3
    - id: evt-battle-four-handed-monstrosity
      title: Battle with the Four-Handed Monstrosity
      type: combat
      locationId: shrike
      description: >-
        The party intervenes in a vicious skirmish to assist Sir Alabaster Cain
        of the House of Salt against a four-handed monstrosity. In gratitude,
        Cain promises them a favor should they seek him out at the House of
        Salt.
      time:
        era: Shrike Era
        year: 515
        month: Month 4
        day: 11
        hour: 9
        minute: 0
    - id: evt-nicodemus-stone
      title: The Errand for Nicodemus
      type: general
      locationId: hollowtown
      description: >-
        Nicodemus entrusts a peculiar stone to Maleficent to be carried to
        Bonnie Morgas, repaying an outstanding favor.
      time:
        era: Shrike Era
        year: 515
        month: Month 4
        day: 11
        hour: 13
        minute: 30
    - id: evt-memories-restored-bonnie
      title: Awakening at Bonnie Morga's Cottage
      type: npc_meet
      locationId: bonnie-morgas-cottage
      description: >-
        The party reaches Bonnie Morga's cottage seeking knowledge. In a pro
        bono gesture, Bonnie has the party drink blood. The draught restores
        their lost memories of their mortality and deaths, revealing they were
        each tasked by the Man in the Green Cloak to free the pierced Nameless
        God.
      time:
        era: Shrike Era
        year: 515
        month: Month 4
        day: 11
        hour: 18
        minute: 0
